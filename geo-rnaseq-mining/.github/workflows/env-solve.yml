name: Environment Solve

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-env-solve:
    name: Linux env solve dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge with Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          mamba-version: "*"
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-activate-base: true

      - name: Show Conda configuration
        shell: bash -el {0}
        run: |
          conda config --set channel_priority strict
          conda info
          conda config --show channel_priority
          conda config --show channels
          mamba --version

      - name: Dry-run solve metadata environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f workflow/envs/metadata.yaml

      - name: Dry-run solve bulk environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f workflow/envs/bulk.yaml
