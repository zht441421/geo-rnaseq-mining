name: Environment Solve

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  env-solve:
    name: Linux env solve dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Miniforge with Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          mamba-version: "*"
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base

      - name: Show Conda configuration
        shell: bash -el {0}
        run: |
          conda config --set channel_priority strict
          conda info
          conda config --show channel_priority
          conda config --show channels
          mamba --version

      - name: Dry-run solve metadata environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/metadata.yaml

      - name: Dry-run solve bulk environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/bulk.yaml

      - name: Dry-run solve base environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/base.yaml

      - name: Dry-run solve data-entry environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/data-entry.yaml

      - name: Dry-run solve bulk-fastqc environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/bulk-fastqc.yaml

      - name: Dry-run solve bulk-salmon environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/bulk-salmon.yaml

      - name: Dry-run solve bulk-star-featurecounts environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/bulk-star-featurecounts.yaml

      - name: Dry-run solve r-bulk environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/r-bulk.yaml

      - name: Dry-run solve report environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/report.yaml

      - name: Dry-run solve scrna environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/scrna.yaml

  high-risk-env-solve:
    name: Linux high-risk env solve dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Miniforge with Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          mamba-version: "*"
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          auto-activate: true
          activate-environment: base

      - name: Show Conda configuration
        shell: bash -el {0}
        run: |
          conda config --set channel_priority strict
          conda info
          conda config --show channel_priority
          conda config --show channels
          mamba --version

      - name: Dry-run solve sra-tools environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/sra-tools.yaml

      - name: Dry-run solve r-bulk-analysis environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/r-bulk-analysis.yaml

      - name: Dry-run solve python-single-cell environment
        shell: bash -el {0}
        run: |
          mamba env create --dry-run -f geo-rnaseq-mining/workflow/envs/python-single-cell.yaml
